plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bokir.wake'
    compileSdk 35

    defaultConfig {
        applicationId "com.bokir.wake"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
}
